<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product detail page</title>
    <link href="style.css"  rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="product-box">
            <img src="fabian-heimann-4R_WEmhx8og-unsplash (1).jpg" alt="product-photo">
            <div class="details">
                <h1>Nike SuperRep Go</h1>
                <h2 class="price">$2,499</h2>
                <h4 class="desc">Premium LEGO Birds collections for kids and adults</h4>
                <button class="btn">Add To Cart</button>
            </div>
        </div>
        <div class="review-box">
            <h2>Customer Reviews</h2>
            <input type="hidden" id="review-id"/>
            <input type="text" id="name" placeholder="Enter your name"/><br>
            <textarea type="text" id="review" placeholder="Write your review"></textarea>
            <button class="Submit">Submit review</button>
            <div id="review-list"></div>
        </div>
    </div>
    <script src="text.js"></script>
</body>
</html>
